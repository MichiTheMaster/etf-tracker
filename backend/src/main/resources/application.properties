spring.application.name=backend

server.port=8081

# Tablet/LAN im Heimnetz: Origin ist http://192.168.x.x:3000, nicht localhost.
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:8088,http://127.0.0.1:8088,http://192.168.*.*:3000,http://192.168.*.*:8088,http://192.168.*.*:8081,http://10.*.*.*:3000,http://10.*.*.*:8088}

jwt.secret=${JWT_SECRET:dev-secret-key-change-me-please-1234567890}
app.security.reject-insecure-jwt=${APP_SECURITY_REJECT_INSECURE_JWT:false}

# --- MySQL Datenbank ---
spring.datasource.url=${DB_URL:jdbc:h2:mem:backend;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.data-source-properties.zeroDateTimeBehavior=CONVERT_TO_NULL

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# Optional: schöneres SQL-Logging
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.etftracker.backend=${LOGGING_LEVEL_APP:INFO}
logging.level.org.hibernate.SQL=${LOGGING_LEVEL_ORG_HIBERNATE_SQL:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOGGING_LEVEL_ORG_HIBERNATE_BINDER:WARN}


# --- Marktdaten ---
# Kurse: offizieller 15-Minuten-Delayed-Feed der Deutschen Boerse (Xetra/Frankfurt).
# TER nur aus der lokalen Fallback-Datei, kein Fremd-Scrape.
app.market.delayed.warmup=${APP_MARKET_DELAYED_WARMUP:true}
ter.fallback.file=./src/main/resources/ter-fallbacks.properties
ter.autoupdate.cron=0 30 2 * * *
ter.autoupdate.fixed-delay-ms=21600000
ter.autoupdate.fixed-initial-delay-ms=900000
app.market.fallback-prices-enabled=${APP_MARKET_FALLBACK_PRICES_ENABLED:true}
# Shared market cache (all users). Quote TTL folgt Admin-Setting market.quoteRefreshMinutes.
app.market.cache.quote-ttl-ms=${APP_MARKET_CACHE_QUOTE_TTL_MS:300000}
app.market.cache.quote-stale-ms=${APP_MARKET_CACHE_QUOTE_STALE_MS:1800000}
app.market.cache.ter-ttl-ms=${APP_MARKET_CACHE_TER_TTL_MS:604800000}
app.market.cache.risk-ttl-ms=${APP_MARKET_CACHE_RISK_TTL_MS:21600000}
app.market.cache.risk-stale-ms=${APP_MARKET_CACHE_RISK_STALE_MS:86400000}
app.market.cache.warmup-delay-ms=${APP_MARKET_CACHE_WARMUP_DELAY_MS:300000}
app.market.cache.warmup-initial-delay-ms=${APP_MARKET_CACHE_WARMUP_INITIAL_DELAY_MS:20000}

app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:3000}
app.email-verification.required=${APP_EMAIL_VERIFICATION_REQUIRED:false}
app.email-verification.token-valid-hours=${APP_EMAIL_VERIFICATION_TOKEN_VALID_HOURS:24}
app.mail.from=${APP_MAIL_FROM:no-reply@etf-tracker.local}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- Privacy / Logging toggles ---
# Truncate stored IPs to /24 (IPv4) or /64 (IPv6) prefix before persisting
app.privacy.ip-truncation.enabled=${APP_PRIVACY_IP_TRUNCATION_ENABLED:true}
# Redact sensitive JSON keys (password, token, ssn, creditCard, cvv) from request body logs
app.privacy.log-masking.enabled=${APP_PRIVACY_LOG_MASKING_ENABLED:true}

# --- Log retention (days) ---
app.logging.audit.retention-days=${APP_LOGGING_AUDIT_RETENTION_DAYS:365}
app.logging.session.retention-days=${APP_LOGGING_SESSION_RETENTION_DAYS:90}
